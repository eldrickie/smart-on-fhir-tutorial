<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SMART Launch</title>
  <link rel="stylesheet" href="./src/css/example-smart-app.css" />
</head>
<body>
  <div class="spinner">
    <div class="bounce1"></div>
    <div class="bounce2"></div>
    <div class="bounce3"></div>
  </div>

  <!-- FHIR client libs -->
  <script src="./lib/js/fhir-client-v0.1.12.js"></script>
  <script src="./lib/js/fhir-client-cerner-additions-1.0.0.js"></script>

  <script>
    console.log('=== SMART Launch Page ===');
    console.log('Full URL:', window.location.href);
    
    // Parse query parameters
    function getParams() {
      var params = {};
      var search = window.location.search.substring(1);
      if (search) {
        search.split('&').forEach(function(pair) {
          var parts = pair.split('=');
          if (parts[0]) {
            params[decodeURIComponent(parts[0])] = decodeURIComponent(parts[1] || '');
          }
        });
      }
      return params;
    }

    var qp = getParams();
    console.log('Launch parameters:', qp);
    console.log('  iss:', qp.iss);
    console.log('  launch:', qp.launch);

    if (!qp.iss || !qp.launch) {
      console.error('❌ ERROR: Missing launch parameters');
      document.body.innerHTML = '<div style="color:red;padding:20px;">ERROR: Missing launch parameters. This app must be launched from an EHR.</div>';
    } else {
      console.log('✅ Launch parameters present, starting OAuth...');
      
      // Patient app configuration - matches your "Edris test" application
      FHIR.oauth2.authorize({
        client_id: '82059b8c-a275-4563-9315-4c447f486965',
        redirect_uri: 'https://eldrickie.github.io/smart-on-fhir-tutorial/example-smart-app/',
        scope: 'launch openid profile fhirUser patient/Patient.read patient/Observation.read',
        iss: qp.iss,
        launch: qp.launch
      });
    }
  </script>
</body>
</html>

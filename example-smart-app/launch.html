<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SMART Launch</title>
  <link rel="stylesheet" href="./src/css/example-smart-app.css" />
</head>
<body>
  <div class="spinner"><div class="bounce1"></div><div class="bounce2"></div><div class="bounce3"></div></div>

  <!-- FHIR client libs -->
  <script src="./lib/js/fhir-client-v0.1.12.js"></script>
  <script src="./lib/js/fhir-client-cerner-additions-1.0.0.js"></script>

  <script>
    // Grab query params (iss, launch, etc.)
    function getParams() {
      const out = {};
      location.search.replace(/^\?/, '').split('&').forEach(kv => {
        if (!kv) return;
        const [k, v] = kv.split('=');
        out[decodeURIComponent(k)] = decodeURIComponent(v || '');
      });
      return out;
    }

    const qp = getParams();
    console.log('Launch params:', qp); // should show iss + launch

    // >>>>>>> IMPORTANT: pass iss + launch explicitly <<<<<<
    FHIR.oauth2.authorize({
      client_id: '8c4c24d4-0447-494c-8492-9599a95c9cb0',
      redirect_uri: 'https://eldrickie.github.io/smart-on-fhir-tutorial/example-smart-app/',
      scope: 'launch openid profile fhirUser patient/Patient.read patient/Observation.read',
      iss: qp.iss,
      launch: qp.launch
    });
  </script>
</body>
</html>

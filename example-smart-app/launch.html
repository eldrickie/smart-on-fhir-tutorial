<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SMART Launch – Eldrich Example</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 24px; }
      .err { color: #b00020; }
      .muted { color: #666; }
      code { background: #f6f8fa; padding: 2px 6px; border-radius: 4px; }
    </style>

    <!-- SMART on FHIR JS Client (v2) -->
    <script src="https://cdn.jsdelivr.net/npm/fhirclient@2.3.10/build/fhir-client.min.js"></script>
  </head>

  <body>
    <h3>Launching SMART App…</h3>
    <p class="muted">This page will redirect through the authorization server.</p>

    <script>
      (function () {
        console.log("[launch] page loaded");

        // --- Read SMART launch parameters from the query string ---
        const qp = new URLSearchParams(window.location.search);
        const iss = qp.get("iss");
        const launch = qp.get("launch");

        if (!iss || !launch) {
          console.error("[launch] Missing iss or launch", { iss, launch });
          document.body.insertAdjacentHTML(
            "beforeend",
            `<p class="err"><strong>Launch Error:</strong> Missing required parameters <code>iss</code> or <code>launch</code>.</p>
             <p class="muted">This page should only be opened by the EHR/Code Console, not directly.</p>`
          );
          return;
        }

        console.log("[launch] Found iss & launch", { iss, launch });

        // --- SMART v2 authorize (PKCE handled automatically) ---
        FHIR.oauth2.authorize({
          // Oracle Code Console client for “Eldrich Test 4”
          clientId: "9bde46d3-bb2f-46bb-b306-78590f2d74bb",

          // EXACTLY the redirect URI you registered in Oracle (note trailing slash)
          redirectUri: "https://smart-on-fhir-tutorial-tan.vercel.app/",

          // Scopes: OpenID + user identity + basic patient reads for the tutorial
          scope: "launch openid profile fhirUser patient/Patient.read patient/Observation.read",

          // EHR-provided launch context
          iss,
          launch
        });
      })();
    </script>
  </body>
</html>

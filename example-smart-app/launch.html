<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SMART Launch - Eldrich Example</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body>
  <h3>Launching SMART App...</h3>

  <!-- Include SMART client libraries FIRST -->
  <script src="https://cdn.jsdelivr.net/npm/fhirclient@2.3.10/build/fhir-client.min.js"></script>

  <script>
    (function () {
      console.log("SMART Launch page loading...");

      // --- STEP 1: Safely read query params (iss + launch) ---
      const qp = new URLSearchParams(window.location.search);
      const iss = qp.get("iss");
      const launch = qp.get("launch");

      if (!iss || !launch) {
        console.error("Missing required SMART launch params", { iss, launch });
        document.body.innerHTML = `
          <h2 style="color:red;">Launch Error</h2>
          <p>Missing required parameters: <b>iss</b> or <b>launch</b>.</p>
          <p>Expected query string like ?iss=https://fhir-ehr.sandboxcerner.com/r4/...&launch=...</p>
        `;
        return;
      }

      console.log("SMART Launch Params ✅", { iss, launch });

      // --- STEP 2: Start SMART-on-FHIR authorization flow ---
      FHIR.oauth2.authorize({
        client_id: "d330dbd2-ff52-4e6b-9c50-5cb6c035dfc7",  // your registered client_id
        redirect_uri: "https://smart-on-fhir-tutorial-tan.vercel.app/", // must match Code Console EXACTLY
        scope: "launch openid profile fhirUser online_access patient/*.read", // include all scopes you need
        iss: iss,
        launch: launch
        // 'state' will be auto-generated and stored by the SMART client
      });

      // --- OPTIONAL DEBUG LOGS ---
      console.log("FHIR.oauth2.authorize() called — redirecting to Cerner auth...");
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Eldrich SMART App - Patient Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      color: #222;
    }
    .error { color: red; }
    pre {
      background: #f4f4f4;
      padding: 10px;
      border-radius: 6px;
      overflow-x: auto;
    }
  </style>
</head>

<body>
  <h2>SMART on FHIR Example App</h2>
  <p id="status">Loading SMART client...</p>
  <pre id="output"></pre>

  <!-- Include SMART client libraries -->
  <script src="https://cdn.jsdelivr.net/npm/fhirclient@2.3.10/build/fhir-client.min.js"></script>

  <script>
    // --- Utility for displaying JSON nicely ---
    function showJSON(obj) {
      const output = document.getElementById("output");
      output.textContent = JSON.stringify(obj, null, 2);
    }

    // --- MAIN LOGIC ---
    FHIR.oauth2.ready(
      // Success callback
      async function (client) {
        console.log("SMART ready ✅");
        document.getElementById("status").textContent = "SMART app connected.";

        // Token check
        const token = client.state?.tokenResponse?.access_token;
        if (!token) {
          document.getElementById("status").textContent = "No token found ❌";
          console.error("Missing access token:", client.state);
          return;
        }

        console.log("Access token obtained:", token ? "✅ Present" : "❌ Missing");
        console.log("Scopes:", client.state.tokenResponse.scope);
        console.log("FHIR server:", client.state.serverUrl);

        // --- Fetch the patient resource ---
        try {
          const patient = await client.request(`Patient/${client.patient.id}`);
          console.log("Patient resource:", patient);
          document.getElementById("status").textContent = `Loaded patient: ${patient.name?.[0]?.text || "(Unnamed)"}`;
          showJSON(patient);
        } catch (err) {
          console.error("Failed to fetch patient data:", err);
          document.getElementById("status").innerHTML = 
            `<span class='error'>Failed to fetch patient data (Status: ${err.status || "unknown"})</span>`;
          showJSON(err);
        }
      },

      // Error callback
      function (error) {
        console.error("SMART initialization failed ❌", error);
        document.getElementById("status").innerHTML =
          `<span class='error'>SMART Initialization Error</span>`;
        showJSON(error);
      }
    );
  </script>
</body>
</html>

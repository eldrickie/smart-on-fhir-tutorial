<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta charset="utf-8" />
    <title>Example-SMART-App</title>
    <link rel="stylesheet" href="./src/css/example-smart-app.css" />
    <style>
      pre.debug { background:#111; color:#0f0; padding:8px; overflow:auto; }
    </style>
  </head>

  <body>
    <div id="errors"></div>

    <div id="loading" class="spinner">
      <div class="bounce1"></div>
      <div class="bounce2"></div>
      <div class="bounce3"></div>
    </div>

    <div id="holder" style="display:none">
      <h2>Example-SMART-App</h2>

      <h2>Patient Resource</h2>
      <table>
        <tr><th>First Name:</th><td id="fname"></td></tr>
        <tr><th>Last Name:</th><td id="lname"></td></tr>
        <tr><th>Gender:</th><td id="gender"></td></tr>
        <tr><th>Date of Birth:</th><td id="birthdate"></td></tr>
      </table>

      <h2>Observation Resource</h2>
      <table>
        <tr><th>Height:</th><td id="height"></td></tr>
        <tr><th>Systolic Blood Pressure:</th><td id="systolicbp"></td></tr>
        <tr><th>Diastolic Blood Pressure:</th><td id="diastolicbp"></td></tr>
        <tr><th>LDL:</th><td id="ldl"></td></tr>
        <tr><th>HDL:</th><td id="hdl"></td></tr>
      </table>
    </div>

    <!-- FHIR Client (must be first) -->
    <script src="./lib/js/fhir-client-v0.1.12.js"></script>
    <!-- Cerner session additions (prevents session bleed) -->
    <script src="./lib/js/fhir-client-cerner-additions-1.0.0.js"></script>
    <!-- jQuery for convenience -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>

    <!-- IMPORTANT: do NOT load example-smart-app.js for now (we bypass it) -->
    <!-- <script src="./src/js/example-smart-app.js"></script> -->

    <script>
      // Helper: safely set a field
      function setField(id, val) {
        document.getElementById(id).textContent = (val ?? "") === "" ? "—" : val;
      }

      // Helper: from a CodeableConcept array find a code match (by code string)
      function findObsByCode(bundle, code) {
        if (!bundle || !Array.isArray(bundle.entry)) return null;
        for (const e of bundle.entry) {
          const r = e.resource;
          if (!r || r.resourceType !== "Observation" || !r.code || !r.code.coding) continue;
          if (r.code.coding.some(c => c && (c.code === code))) return r;
        }
        return null;
      }

      // Render observations into page
      function renderObservations(obsBundle) {
        // Common LOINC codes
        const HEIGHT = "8302-2";
        const SYS = "8480-6";
        const DIA = "8462-4";
        const LDL = "13457-7";
        const HDL = "2085-9";

        function valueText(obs) {
          if (!obs) return "—";
          const vq = obs.valueQuantity;
          const vs = obs.valueString || obs.valueCodeableConcept?.text;
          if (vq && (vq.value != null)) return `${vq.value} ${vq.unit || ""}`.trim();
          if (vs) return vs;
          // Sometimes components hold values (e.g., BP panels)
          if (Array.isArray(obs.component)) {
            const compVal = obs.component.map(c => {
              const v = c.valueQuantity;
              if (v && (v.value != null)) return `${v.value} ${v.unit || ""}`.trim();
              return null;
            }).filter(Boolean)[0];
            if (compVal) return compVal;
          }
          return "—";
        }

        setField("height",      valueText(findObsByCode(obsBundle, HEIGHT)));
        setField("systolicbp",  valueText(findObsByCode(obsBundle, SYS)));
        setField("diastolicbp", valueText(findObsByCode(obsBundle, DIA)));
        setField("ldl",         valueText(findObsByCode(obsBundle, LDL)));
        setField("hdl",         valueText(findObsByCode(obsBundle, HDL)));
      }

      // SMART init (v0.1.12 uses callbacks)
      FHIR.oauth2.ready(
        function (client) {
          // Debug to console
          console.log("SMART ready ✅");
          console.log("ISS:", client?.state?.serverUrl);
          console.log("Has token:", !!client?.state?.tokenResponse?.access_token);
          console.log("Patient:", client?.patient?.id);

          // Show loading spinner until we have data
          const patientId = client?.patient?.id;
          if (!patientId) {
            $('#loading').hide();
            $('#errors').html('<p>No patient context provided.</p>');
            return;
          }

          // Fetch Patient then Observations
          Promise.all([
            client.request(`Patient/${patientId}`),
            client.request(`Observation?patient=${encodeURIComponent(patientId)}&_count=200`)
          ])
          .then(([patient, obsBundle]) => {
            // Populate patient
            const name = (patient.name && patient.name[0]) || {};
            const given = Array.isArray(name.given) ? name.given[0] : (name.given || "");
            const family = name.family || "";
            setField("fname", given);
            setField("lname", family);
            setField("gender", patient.gender || "—");
            setField("birthdate", patient.birthDate || "—");

            // Populate observations
            renderObservations(obsBundle);

            // Swap UI
            $('#loading').hide();
            document.getElementById('holder').style.display = '';
          })
          .catch(err => {
            console.error("FHIR request failed:", err);
            $('#loading').hide();
            $('#errors').html(
              '<p> Failed to call FHIR Service: ' + (err?.message || JSON.stringify(err)) + '</p>'
            );
            // Optional: dump error for quick inspection
            const pre = document.createElement('pre');
            pre.className = 'debug';
            pre.textContent = 'Error detail:\n' + (err?.responseText || JSON.stringify(err, null, 2));
            document.body.appendChild(pre);
          });
        },
        function (error) {
          console.error("SMART init error:", error);
          $('#loading').hide();
          $('#errors').html(
            '<p> OAuth authorization failed: ' + (error?.message || JSON.stringify(error)) + '</p>'
          );
        }
      );
    </script>
  </body>
</html>

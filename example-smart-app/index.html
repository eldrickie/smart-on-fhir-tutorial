<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta charset="utf-8" />
    <title>Example-SMART-App</title>
    <link rel="stylesheet" href="./src/css/example-smart-app.css" />
    <style> 
      pre.debug{background:#111;color:#0f0;padding:8px;overflow:auto;font-size:11px;max-height:400px;}
      .error{color:red;padding:10px;background:#ffe0e0;border:1px solid red;margin:10px;}
    </style>
  </head>

  <body>
    <div id="errors"></div>

    <div id="loading" class="spinner">
      <div class="bounce1"></div><div class="bounce2"></div><div class="bounce3"></div>
    </div>

    <div id="holder" style="display:none">
      <h2>Example-SMART-App</h2>

      <h2>Patient Resource</h2>
      <table>
        <tr><th>First Name:</th><td id="fname"></td></tr>
        <tr><th>Last Name:</th><td id="lname"></td></tr>
        <tr><th>Gender:</th><td id="gender"></td></tr>
        <tr><th>Date of Birth:</th><td id="birthdate"></td></tr>
      </table>

      <h2>Observation Resource</h2>
      <table>
        <tr><th>Height:</th><td id="height"></td></tr>
        <tr><th>Systolic Blood Pressure:</th><td id="systolicbp"></td></tr>
        <tr><th>Diastolic Blood Pressure:</th><td id="diastolicbp"></td></tr>
        <tr><th>LDL:</th><td id="ldl"></td></tr>
        <tr><th>HDL:</th><td id="hdl"></td></tr>
      </table>
    </div>

    <!-- FHIR client libs -->
    <script src="./lib/js/fhir-client-v0.1.12.js"></script>
    <script src="./lib/js/fhir-client-cerner-additions-1.0.0.js"></script>
    
    <!-- jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>

    <script>
      function setText(id, v){ 
        var el = document.getElementById(id);
        if (el) el.textContent = v || '—';
      }

      function showError(msg, detail) {
        console.error(msg, detail);
        document.getElementById('loading').style.display = 'none';
        var errorHtml = '<div class="error"><strong>' + msg + '</strong></div>';
        document.getElementById('errors').innerHTML = errorHtml;
        
        if (detail) {
          var pre = document.createElement('pre');
          pre.className = 'debug';
          pre.textContent = typeof detail === 'string' ? detail : JSON.stringify(detail, null, 2);
          document.getElementById('errors').appendChild(pre);
        }
      }

      console.log('=== Starting SMART App ===');
      console.log('URL:', window.location.href);
      console.log('URL params:', window.location.search);
      console.log('URL hash:', window.location.hash);

      // Check sessionStorage for debug
      try {
        console.log('SessionStorage keys:', Object.keys(sessionStorage));
        for (var i = 0; i < sessionStorage.length; i++) {
          var key = sessionStorage.key(i);
          if (key.indexOf('fhir') !== -1 || key.indexOf('smart') !== -1) {
            console.log('SessionStorage[' + key + ']:', sessionStorage.getItem(key));
          }
        }
      } catch(e) {
        console.error('Cannot access sessionStorage:', e);
      }

      // FHIR.oauth2.ready callback
      FHIR.oauth2.ready(
        function (smart) {
          console.log('=== SMART ready ✅ ===');
          console.log('Smart object:', smart);
          
          // Deep dive into the smart object structure
          if (smart.state) {
            console.log('Smart.state:', smart.state);
            console.log('Smart.state.serverUrl:', smart.state.serverUrl);
            console.log('Smart.state.tokenResponse:', smart.state.tokenResponse);
            console.log('Smart.state.provider:', smart.state.provider);
          } else {
            console.warn('⚠️ smart.state is missing!');
          }
          
          if (smart.server) {
            console.log('Smart.server:', smart.server);
            console.log('Smart.server.serviceUrl:', smart.server.serviceUrl);
          }
          
          if (smart.tokenResponse) {
            console.log('Smart.tokenResponse:', smart.tokenResponse);
          }

          // Try to get ISS from multiple possible locations
          var iss = (smart.state && smart.state.serverUrl) || 
                    (smart.server && smart.server.serviceUrl) ||
                    (smart.state && smart.state.provider && smart.state.provider.url);
          
          console.log('ISS (FHIR Server URL):', iss);

          // Try to get token from multiple possible locations
          var token = (smart.state && smart.state.tokenResponse && smart.state.tokenResponse.access_token) ||
                     (smart.tokenResponse && smart.tokenResponse.access_token);
          
          console.log('Has token:', !!token);
          console.log('Token (first 20 chars):', token ? token.substring(0, 20) + '...' : 'NONE');

          // Get patient ID
          var pid = smart.patient && smart.patient.id;
          console.log('Patient ID:', pid);

          // Validation checks
          if (!iss) {
            showError(
              'OAuth Error: FHIR Server URL (ISS) is missing!',
              'The OAuth flow completed but the FHIR server URL was not saved. ' +
              'This usually means there is a problem with sessionStorage or the OAuth state. ' +
              'Check the browser console for sessionStorage contents.'
            );
            return;
          }

          if (!token) {
            showError(
              'OAuth Error: Access token is missing!',
              'The OAuth flow completed but no access token was received. ' +
              'ISS: ' + iss + '\n' +
              'Patient: ' + pid + '\n\n' +
              'Check that your app has the correct scopes and that the authorization completed successfully.'
            );
            return;
          }

          if (!pid) {
            showError(
              'No Patient Context',
              'No patient ID was provided in the launch context. ' +
              'Make sure you are launching the app with a patient selected.'
            );
            return;
          }

          console.log('✅ All OAuth checks passed. Fetching data...');
          console.log('Fetching from server:', iss);
          console.log('For patient:', pid);

          // Fetch patient data
          var p$ = smart.patient.read();

          // Fetch observations
          var codes = '8302-2,8480-6,8462-4,13457-7,2085-9';
          var o$ = smart.api.search({
            type: 'Observation',
            query: { 
              patient: pid, 
              code: codes, 
              _count: 100 
            }
          });

          $.when(p$, o$).done(function(patient, obsBundle) {
            try {
              console.log('✅ Data fetched successfully!');
              console.log('Patient response:', patient);
              console.log('Observations response:', obsBundle);
              
              var p = patient.data || patient;
              var name = (p.name && p.name[0]) || {};
              var given = Array.isArray(name.given) ? name.given.join(' ') : (name.given || '');
              var family = name.family || '';
              
              setText('fname', given);
              setText('lname', family);
              setText('gender', p.gender);
              setText('birthdate', p.birthDate);

              var bundle = obsBundle.data || obsBundle;
              
              function byCode(c) {
                var entries = (bundle.entry || []).map(function(e) { return e.resource; }).filter(Boolean);
                return entries.find(function(r) {
                  return r.code && r.code.coding && r.code.coding.some(function(x) { return x.code === c; });
                });
              }
              
              function val(obs) {
                if (!obs) return '—';
                var q = obs.valueQuantity;
                if (q && q.value != null) return (q.value + ' ' + (q.unit || '')).trim();
                var s = obs.valueString || (obs.valueCodeableConcept && obs.valueCodeableConcept.text);
                if (s) return s;
                if (Array.isArray(obs.component)) {
                  for (var i = 0; i < obs.component.length; i++) {
                    var comp = obs.component[i];
                    var v = comp.valueQuantity;
                    if (v && v.value != null) return (v.value + ' ' + (v.unit || '')).trim();
                  }
                }
                return '—';
              }

              setText('height', val(byCode('8302-2')));
              setText('systolicbp', val(byCode('8480-6')));
              setText('diastolicbp', val(byCode('8462-4')));
              setText('ldl', val(byCode('13457-7')));
              setText('hdl', val(byCode('2085-9')));

              document.getElementById('loading').style.display = 'none';
              document.getElementById('holder').style.display = '';
              console.log('✅ Display complete!');
              
            } catch (err) {
              showError('Render Error', err.message + '\n\n' + err.stack);
            }
          }).fail(function(err) {
            console.error('❌ FHIR request failed:', err);
            var errorMsg = 'Failed to fetch data from FHIR server';
            var errorDetail = 'Server: ' + iss + '\n' +
                             'Patient: ' + pid + '\n\n';
            
            if (err.responseText) {
              errorDetail += 'Response: ' + err.responseText;
            } else if (err.message) {
              errorDetail += 'Error: ' + err.message;
            } else {
              errorDetail += 'Error object: ' + JSON.stringify(err, null, 2);
            }
            
            showError(errorMsg, errorDetail);
          });
        },
        function (error) {
          console.error('❌ SMART OAuth ready failed:', error);
          showError(
            'OAuth Authorization Failed',
            'The OAuth flow did not complete successfully.\n\n' +
            'Error: ' + (error && error.message || JSON.stringify(error))
          );
        }
      );
    </script>
  </body>
</html>

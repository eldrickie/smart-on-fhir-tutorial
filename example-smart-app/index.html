<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta charset="utf-8" />
    <title>Example-SMART-App</title>
    <link rel="stylesheet" href="./src/css/example-smart-app.css" />
    <style> pre.debug{background:#111;color:#0f0;padding:8px;overflow:auto} </style>
  </head>

  <body>
    <div id="errors"></div>

    <div id="loading" class="spinner">
      <div class="bounce1"></div><div class="bounce2"></div><div class="bounce3"></div>
    </div>

    <div id="holder" style="display:none">
      <h2>Example-SMART-App</h2>

      <h2>Patient Resource</h2>
      <table>
        <tr><th>First Name:</th><td id="fname"></td></tr>
        <tr><th>Last Name:</th><td id="lname"></td></tr>
        <tr><th>Gender:</th><td id="gender"></td></tr>
        <tr><th>Date of Birth:</th><td id="birthdate"></td></tr>
      </table>

      <h2>Observation Resource</h2>
      <table>
        <tr><th>Height:</th><td id="height"></td></tr>
        <tr><th>Systolic Blood Pressure:</th><td id="systolicbp"></td></tr>
        <tr><th>Diastolic Blood Pressure:</th><td id="diastolicbp"></td></tr>
        <tr><th>LDL:</th><td id="ldl"></td></tr>
        <tr><th>HDL:</th><td id="hdl"></td></tr>
      </table>
    </div>

    <!-- FHIR client (must be first) -->
    <script src="./lib/js/fhir-client-v0.1.12.js"></script>
    <script src="./lib/js/fhir-client-cerner-additions-1.0.0.js"></script>

    <script>
      function setText(id, v){ document.getElementById(id).textContent = v ?? '—'; }
      function loinc(code){ return {system:"http://loinc.org", code }; }

      // v0.1.12: use callback style
      FHIR.oauth2.ready(
        function (smart) {
          console.log('SMART ready ✅');
          console.log('ISS:', smart && smart.state && smart.state.serverUrl);
          console.log('Has token:', !!(smart && smart.state && smart.state.tokenResponse && smart.state.tokenResponse.access_token));
          console.log('Patient:', smart && smart.patient && smart.patient.id());

          const pid = smart.patient && smart.patient.id();
          if (!pid) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('errors').innerHTML = '<p>No patient context provided.</p>';
            return;
          }

          // ---- Patient ----
          const p$ = smart.patient.read();  // v0.1.12 API

          // ---- Observations (search by patient & selected LOINCs) ----
          const codes = [
            '8302-2',  // Height
            '8480-6',  // Systolic BP
            '8462-4',  // Diastolic BP
            '13457-7', // LDL
            '2085-9'   // HDL
          ].join(',');

          const o$ = smart.api.search({
            type: 'Observation',
            query: { patient: pid, code: codes, _count: 200 }
          });

          // Render when both are ready
          smart.jquery.when(p$, o$).done(function(patient, obsBundle) {
            try {
              // patient is wrapped in jQuery deferred result array
              const p = patient.data || patient; 
              const name = (p.name && p.name[0]) || {};
              const given = Array.isArray(name.given) ? name.given[0] : (name.given || '');
              const family = name.family || '';
              setText('fname', given);
              setText('lname', family);
              setText('gender', p.gender || '—');
              setText('birthdate', p.birthDate || '—');

              const bundle = obsBundle.data || obsBundle;
              function byCode(c) {
                const entries = (bundle.entry || []).map(e => e.resource).filter(Boolean);
                return entries.find(r => r.code && r.code.coding && r.code.coding.some(x => x.code === c));
              }
              function val(obs) {
                if (!obs) return '—';
                const q = obs.valueQuantity;
                if (q && q.value != null) return (q.value + ' ' + (q.unit || '')).trim();
                const s = obs.valueString || obs.valueCodeableConcept?.text;
                if (s) return s;
                if (Array.isArray(obs.component)) {
                  for (const c of obs.component) {
                    const v = c.valueQuantity;
                    if (v && v.value != null) return (v.value + ' ' + (v.unit || '')).trim();
                  }
                }
                return '—';
              }

              setText('height',      val(byCode('8302-2')));
              setText('systolicbp',  val(byCode('8480-6')));
              setText('diastolicbp', val(byCode('8462-4')));
              setText('ldl',         val(byCode('13457-7')));
              setText('hdl',         val(byCode('2085-9')));

              document.getElementById('loading').style.display = 'none';
              document.getElementById('holder').style.display = '';
            } catch (err) {
              console.error(err);
              document.getElementById('loading').style.display = 'none';
              document.getElementById('errors').innerHTML = '<p>Render error: ' + (err.message || JSON.stringify(err)) + '</p>';
            }
          }).fail(function(err) {
            console.error('FHIR request failed:', err);
            document.getElementById('loading').style.display = 'none';
            document.getElementById('errors').innerHTML = '<p>Failed to call FHIR Service: ' + (err?.responseText || err?.message || JSON.stringify(err)) + '</p>';
            const pre = document.createElement('pre');
            pre.className = 'debug';
            pre.textContent = 'Error detail:\n' + (err?.responseText || JSON.stringify(err, null, 2));
            document.body.appendChild(pre);
          });
        },
        function (error) {
          console.error('SMART init error:', error);
          document.getElementById('loading').style.display = 'none';
          document.getElementById('errors').innerHTML = '<p>OAuth authorization failed: ' + (error?.message || JSON.stringify(error)) + '</p>';
        }
      );
    </script>
  </body>
</html>
